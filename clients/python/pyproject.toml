[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coral-cloud"
version = "0.1.0"
description = "Python SDK for Coral Cloud — give AI agents authenticated browser sessions via an API key."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Coral contributors" }]
keywords = ["ai", "agents", "browser-automation", "cdp", "playwright", "coral"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pyright>=1.1",
  "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/noelschwarz/coral"
Repository = "https://github.com/noelschwarz/coral"
Protocol = "https://github.com/noelschwarz/coral/blob/main/protocol/openapi.yaml"

[tool.hatch.build.targets.wheel]
packages = ["src/coral_cloud"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src"]
